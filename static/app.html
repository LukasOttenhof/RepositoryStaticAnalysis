<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aida</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-logo">Aida</div>
    <span class="nav-user" id="nav-username"></span>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
  </nav>

  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="btn-new-chat" onclick="newChat()">+ New Chat</button>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <!-- injected by JS -->
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="messages" id="messages">
        <!-- injected by JS -->
      </div>

      <div class="input-area">
        <div class="file-preview" id="file-preview"></div>
        <div class="input-row">
          <button class="btn-attach" title="Attach file (or paste image)" onclick="document.getElementById('file-input').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <textarea id="message-input" placeholder="Ask a Python programming question…" rows="1"></textarea>
          <button class="btn-send" id="send-btn" onclick="sendMessage()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Send
          </button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for newline · Paste images with Ctrl+V</div>
      </div>
    </main>

  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" multiple
  accept=".py,.md,.txt,.js,.ts,.jsx,.tsx,.html,.htm,.css,.json,.xml,.csv,.yml,.yaml,.sh,.rb,.java,.c,.cpp,.h,.rs,.go,image/png,image/jpeg,image/gif,image/webp"
  style="display:none" onchange="handleFileSelect(this.files)">

<script src="/static/app.js"></script>
</body>
</html>
